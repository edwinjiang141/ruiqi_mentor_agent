    <style>

    <!-- 添加新的样式 -->
    <style>
        .nav-blocks-container {
            width: 100%;
            padding: 20px;
            background: var(--boxmain);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .nav-blocks {
            display: flex;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .nav-block {
            width: 150px;
            height: 120px;
            border-radius: 12px;
            background: var(--blur-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .nav-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .nav-block.active {
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            color: white;
        }
        
        .nav-block.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        
        .nav-block i {
            font-size: 32px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            z-index: 1;
        }
        
        .nav-block span {
            font-size: 16px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 1;
        }
        
        .nav-block:hover i,
        .nav-block.active i {
            transform: scale(1.1);
        }
        
        /* 添加点击反馈效果 */
        .nav-block:active {
            transform: scale(0.95);
        }
        
        /* 自定义每个方块的颜色 */
        .nav-block[data-value="image_to_text"] {
            border-left: 4px solid #4CAF50;
        }
        
        .nav-block[data-value="ora_awr"] {
            border-left: 4px solid #2196F3;
        }
        
        .nav-block[data-value="ora_doc"] {
            border-left: 4px solid #FF9800;
        }
        
        .nav-block[data-value="image_to_text"].active {
            background: linear-gradient(145deg, #4CAF50, #45a049);
        }
        
        .nav-block[data-value="ora_awr"].active {
            background: linear-gradient(145deg, #2196F3, #1e88e5);
        }
        
        .nav-block[data-value="ora_doc"].active {
            background: linear-gradient(145deg, #FF9800, #f57c00);
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .nav-blocks {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
            }
        
            .nav-block {
                width: calc(33.33% - 10px);
                height: 100px;
            }
        
            .nav-block i {
                font-size: 24px;
            }
        
            .nav-block span {
                font-size: 14px;
            }
        }
        .nav-block[data-value="ora_check"] {
            border-left: 4px solid #9C27B0;  /* 紫色边框 */
        }

        .nav-block[data-value="ora_check"].active {
            background: linear-gradient(145deg, #9C27B0, #7B1FA2);
        }

        /* 调整导航块容器宽度以适应新增的按钮 */
        .nav-blocks {
            max-width: 800px;  /* 增加最大宽度以容纳新按钮 */
            gap: 12px;  /* 稍微减小间距以适应新按钮 */
        }

        .nav-block {
            width: 110px;  /* 稍微减小每个块的宽度 */
            height: 85px;  /* 相应调整高度 */
        }

        /* 文件信息显示*/
        .file-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
            padding: 10px;
            background: var(--blur-bg);
            border-radius: 8px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 14px;
        }

        .file-item i {
            font-size: 16px;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-block[data-value="data_analysis"] {
        border-left: 4px solid #E91E63;
        }

        .nav-block[data-value="data_analysis"].active {
            background: linear-gradient(145deg, #E91E63, #C2185B);
        }

        /* 调整导航块容器宽度以适应新增的按钮 */
        .nav-blocks {
            max-width: 1000px;  /* 增加最大宽度以容纳新按钮 */
        }

        .nav-block {
            width: 100px;  /* 稍微调整每个块的宽度 */
            height: 85px;
        }

    /* 移动端适配 */
        @media (max-width: 768px) {
            .nav-block {
                width: calc(33.33% - 10px);
            }
        }

        </style>

    <script>
        window.conversation_id = `{{chat_id}}`
        document.addEventListener('DOMContentLoaded', function () {
                fetch('/api/config')
                    .then(response => response.json())
                    .then(data => {
                        // 提取 rag_config.topk 的值
                        const topk = data.rag_config.topk;

                        // 将值设置到 input 元素中
                        const inputElement = document.getElementById('vdb_topk');
                        inputElement.value = topk;

                         // 提取 rag_config.topk 的值
                        const topn = data.rag_config.rerank_topN;

                        // 将值设置到 input 元素中
                        const inputElement2 = document.getElementById('rank_topn');
                        inputElement2.value = topn;

                         // 提取 rag_config.topk 的值
                        const input_score = data.rerank_model.score;

                        // 将值设置到 input 元素中
                        const inputElement3 = document.getElementById('input_score');
                        inputElement3.value = input_score;
                    })
                    .catch(error => console.error('Error fetching config:', error));
            });
            
    </script>

    <script>
        document.getElementById('languageSelect').addEventListener('change', function () {
                var selectedLanguage = this.value;
                var form = document.getElementById('languageForm');
                form.action = '/set_language/' + selectedLanguage;
                form.submit();
            });
            document.getElementById('languageLink').addEventListener('click', function (event) {
        // Prevent the default link action
        event.preventDefault();

        // Get the selected language value from the dropdown
        const selectedLang = document.getElementById('languageSelect').value;

        // Update the href of the link
        const link = `http://{{ config_options['site_config']['host'] }}:8501/?lang=${selectedLang}`;

        // Redirect to the updated link
        window.open(link, '_blank');
    });

        
    </script>
