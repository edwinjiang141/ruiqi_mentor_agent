<!DOCTYPE html>
<html lang="{{ session.get('language', 'zh_CN') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Loader</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/icons.js"></script>
    <script src="/assets/js/markdown-it.min.js"></script>
    <link rel="stylesheet" href="/assets/css/github-dark.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background-color: var(--blur-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .upload-container, .query-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .query-results-wrapper {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>RAG Loader</h1>
        <div class="upload-container">
            <h2>文档加载</h2>
            <select id="vectordb">
                <option value="ora-yunwei" selected>上传Oracle运维文档</option>
                <option value="ora-guzhang">上传Oracle故障报告</option>
                <option value="ora-mos">上传MOS文档</option>
            </select>
            <input type="file" id="file-upload" multiple>
            <button id="upload-button">上传</button>
            <ul id="doc-list" class="file-list"></ul>
        </div>
        <div class="query-container">
            <h2>文档查询</h2>
            <input type="text" id="query-input" placeholder="输入查询关键词">
            <button id="query-button">查询</button>
        </div>
        <div class="vector-container">
            <h2>文档维护</h2>
            <button id="load-files">加载文件列表</button>
        </div>     
    </div>
    <div class="content">
        <h2>问题查询结果</h2>
        <div class="query-results-wrapper">
            <ul id="query-results" class="file-list"></ul>
        </div>
        <br><br><br><br>
        <h2>向量文件列表</h2>
        <div class="vector-results-wrapper">
            <table id="vector-results" class="file-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>文件名称</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 这里会动态插入文件列表 -->
                </tbody>
            </table>
            <button id="delete-files">删除选中的文件</button>
        </div>



        <!-- <h2>操作日志</h2>
        <pre id="log-output">请在左侧选择功能进行操作...</pre> -->
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("upload-button").addEventListener("click", async function () {
                const files = document.getElementById("file-upload").files;
                if (!files.length) return alert("请选择文件");
                const formData = new FormData();
                Array.from(files).forEach(file => formData.append("files", file));
                formData.append("category", document.getElementById("vectordb").value);
                const response = await fetch('/backend-api/v2/ragloader', { method: 'POST', body: formData });
                document.getElementById("log-output").textContent = await response.text();
            });
            document.getElementById("query-button").addEventListener("click", async function () {
                const query = document.getElementById("query-input").value.trim();
                if (!query) return alert("请输入查询关键词");
                try {
                    const response = await fetch(`/backend-api/v2/ragsearch?query=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    const results = document.getElementById("query-results");
                    results.innerHTML = ""; 
                    if (data.status === "success" && data.results.length > 0) {
                        data.results.forEach(result => {
                            const listItem = document.createElement("li");
                            listItem.innerHTML = `
                                <strong>📄 文档:</strong> ${result.document} <br>
                                <strong>📜 内容:</strong> ${result.content} <br>
                                <strong>📜 等分:</strong> ${result.score} <br>
                            `;
                            results.appendChild(listItem);
                        });
                    } else {
                        results.innerHTML = "<li>未找到匹配的文档</li>";
                    }
                } catch (error) {
                    console.error("查询错误:", error);
                    alert("查询失败，请检查后端服务是否正常！");
                }
            });

            document.getElementById("load-files").addEventListener("click", async function () {
                try {
                    const response = await fetch("/backend-api/v2/raglist");
                    const data = await response.json();

                    const tableBody = document.querySelector("#vector-results tbody");
                    const selectAllCheckbox = document.getElementById("select-all");

                    tableBody.innerHTML = ""; // **清空旧数据**
                    console.log("API 返回的文件列表:", data.files);

                    if (data.status === "success" && data.files.length > 0) {
                        let tableRows = "";

                        data.files.forEach(file => {
                            console.log("正在创建文件项:", file);

                            // **使用 innerHTML 方式，确保 checkbox 正确插入**
                            tableRows += `
                                <tr>
                                    <td><input type="checkbox" class="file-checkbox" value="${file}"></td>
                                    <td>${file}</td>
                                </tr>
                            `;
                        });

                        tableBody.innerHTML = tableRows;

                        // ✅ 确保"全选"复选框功能生效
                        selectAllCheckbox.addEventListener("change", function () {
                            document.querySelectorAll(".file-checkbox").forEach(checkbox => {
                                checkbox.checked = selectAllCheckbox.checked;
                            });
                        });

                    } else {
                        tableBody.innerHTML = "<tr><td colspan='2'>没有文件</td></tr>";
                    }
                } catch (error) {
                    console.error("加载向量文件错误:", error);
                    alert("加载文件失败，请检查后端服务！");
                }
            });




            document.getElementById("select-all").addEventListener("change", function () {
                const checkboxes = document.querySelectorAll(".file-checkbox");
                checkboxes.forEach(checkbox => {
                    checkbox.checked = this.checked;
                });
            });


            document.getElementById("delete-files").addEventListener("click", async function () {
                try {
                    const checkboxes = document.querySelectorAll(".file-checkbox:checked");
                    const selectedFiles = Array.from(checkboxes).map(checkbox => checkbox.value);

                    console.log("删除的文件:", selectedFiles); // **调试**

                    if (selectedFiles.length === 0) {
                        alert("请先选择要删除的文件！");
                        return;
                    }

                    const response = await fetch("/backend-api/v2/ragdelete", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ files: selectedFiles })
                    });

                    const data = await response.json();
                    if (data.status === "success") {
                        alert("删除成功！");
                        document.getElementById("load-files").click(); // **重新加载列表**
                    } else {
                        alert("删除失败：" + data.message);
                    }
                } catch (error) {
                    console.error("删除文件错误:", error);
                    alert("删除失败，请检查后端服务！");
                }
            });







        });
    </script>
</body>
</html>
